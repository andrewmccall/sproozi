name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.6'

      # Caches written by pushes to main are readable by every pull request.
      # GitHub scopes a cache written by a pull request run to that pull
      # request's ref, so one pull request cannot seed another's linter.
      - name: Read pinned golangci-lint version
        id: golangci-lint
        run: echo "version=$(sed -n 's/^GOLANGCI_LINT_VERSION ?= //p' Makefile)" >> "$GITHUB_OUTPUT"

      # The plugin build compiles golangci-lint with logcheck. Every input is
      # pinned: the verified release, .custom-gcl.yml and the Go toolchain.
      - name: Restore custom golangci-lint binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/golangci-lint
            bin/golangci-lint-${{ steps.golangci-lint.outputs.version }}
          key: golangci-lint-bin-${{ runner.os }}-${{ runner.arch }}-go1.26.6-${{ hashFiles('Makefile', '.custom-gcl.yml', 'hack/verify/install-golangci-lint.sh') }}

      - name: Restore golangci-lint analysis cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ steps.golangci-lint.outputs.version }}-${{ hashFiles('go.sum', '.golangci.yml') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ steps.golangci-lint.outputs.version }}-

      - name: Check linter configuration
        run: make lint-config
      - name: Run linter
        run: make lint
