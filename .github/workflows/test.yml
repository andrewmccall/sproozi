name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  copilot-sign-in:
    permissions:
      contents: read
    name: Pinned Copilot GitHub account and MCP policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version: '1.26.10'
      - name: Install the locked Copilot client without lifecycle scripts
        run: |
          npm ci --prefix hack/clients/copilot --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/hack/clients/copilot/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Verify GitHub account startup, MCP policy, capability denial and diagnose
        run: go run ./hack/verify/harness-process --harness copilot-github --output .local/verification/copilot-github.json
      - name: Retain Copilot account verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: copilot-github-evidence
          path: .local/verification/copilot-github.json
          include-hidden-files: true
          if-no-files-found: warn

  # The race run proves everything a plain run does, so CI runs the unit
  # packages once, under -race with coverage, split into two shards.
  race-1:
    permissions:
      contents: read
    name: Generated code, vet and race tests (1 of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'

      - name: Check generated code, manifests and formatting
        run: make verify-generated
      - name: Run go vet
        run: make vet
      - name: Run race tests with coverage (test/ and internal/session)
        run: make verify-race RACE_SHARD=1

  race-2:
    permissions:
      contents: read
    name: Race tests (2 of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'

      - name: Run race tests with coverage (all other packages)
        run: make verify-race RACE_SHARD=2

  checks:
    permissions:
      contents: read
    name: Protocol, MCP, fixture and docs checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.10'

      - name: Install pinned Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --require-hashes --no-deps -r hack/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Verify pinned client protocol fixtures
        run: make verify-protocol
      # make verify-mcp's Go tests (six packages and the MCP example check in
      # test/manifests) already run in race-1 and race-2; CI runs only its
      # Python parts here.
      - name: Verify the live MCP verifier and mcp-tools offline
        run: |
          python3 hack/verify/mcp-live-test.py
          python3 hack/mcp_tools_test.py
      - name: Run offline fixture and script regressions
        run: make verify-workflow-fixtures
      - name: Verify documentation
        run: make verify-docs
