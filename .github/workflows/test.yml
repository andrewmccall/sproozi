name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # The race run proves everything a plain run does, so CI runs the unit
  # packages once, under -race with coverage, split into two shards.
  race-1:
    permissions:
      contents: read
    name: Generated code, vet and race tests (1 of 2)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.6'

      - name: Check generated code, manifests and formatting
        run: make verify-generated
      - name: Run go vet
        run: make vet
      - name: Run race tests with coverage (test/ and internal/session)
        run: make verify-race RACE_SHARD=1

  race-2:
    permissions:
      contents: read
    name: Race tests (2 of 2)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.6'

      - name: Run race tests with coverage (all other packages)
        run: make verify-race RACE_SHARD=2

  checks:
    permissions:
      contents: read
    name: Protocol, MCP, fixture and docs checks
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.6'

      - name: Verify pinned client protocol fixtures
        run: make verify-protocol
      # make verify-mcp also race-tests five packages that race-1 and race-2
      # already cover; CI runs only its offline verifier part here.
      - name: Verify the live MCP verifier offline
        run: python3 hack/verify/mcp-live-test.py
      - name: Run offline fixture and script regressions
        run: make verify-workflow-fixtures
      - name: Verify documentation
        run: make verify-docs
