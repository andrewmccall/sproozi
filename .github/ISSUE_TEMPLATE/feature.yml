name: Feature request
description: Propose a workflow, harness, gateway integration or policy change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do with Sproozi, and what stops you today? Mention the harness and Docker or Kubernetes if relevant.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: What should Sproozi do? Include a workaround or alternative you have tried, if any.
