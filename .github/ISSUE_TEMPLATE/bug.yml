name: Bug report
description: Report a failure in setup, sessions, AgentRuns or gateway access.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report suspected sandbox escapes, gateway bypasses or credential exposure
        [privately](https://github.com/andrewmccall/sproozi/security/advisories/new).
        Remove credentials, sign-in URLs, private repository content and sensitive
        prompts from commands, configuration and logs before posting.
  - type: input
    id: version
    attributes:
      label: Sproozi version
      description: Output of `sproozi --version`, or the release or commit you installed. Note any different controller or gateway image versions.
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Where it ran
      options: [Local Docker, Kubernetes, Docker and Kubernetes, Not applicable, Unsure]
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options: [Codex, Claude Code, GitHub Copilot CLI, OpenCode, Hermes, Multiple harnesses, Not applicable, Unsure]
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Harness client version
      description: For example the output of `codex --version` in the session, if you know it.
  - type: dropdown
    id: area
    attributes:
      label: What were you doing?
      multiple: true
      options:
        - Installing or setting up with sproozi init
        - Starting, attaching to or stopping a session
        - Resuming or moving a session between placements
        - Submitting or managing remote work
        - Running an AgentRun or investigating its lifecycle
        - Signing in or calling a model provider
        - Accessing Kubernetes, GitHub, packages or MCP tools through the gateway
        - Tracking budgets or usage
        - Loading instructions or skills from a profile
        - Something else
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      description: Include the command or resource that failed, the exact error, and the result you expected. For a regression, give the last working version if known.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that reproduces the problem. A partial reproduction is useful if it is intermittent.
      placeholder: |
        1. Set up ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sign-in method
      description: |
        Include what applies: host OS and architecture, Docker version, Kubernetes
        version and network plugin, and installation method such as Homebrew,
        release binary or source. For model problems, name the provider and
        whether the gateway holds an API key or sign-in token, or the harness
        uses its own sign-in. Never include the credential itself.
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: |
        Share only the redacted settings needed to reproduce it. For local
        sessions, include relevant config.json fields. For Kubernetes, include
        relevant AgentRun, AgentTemplate, AgentRuntime and AgentPolicy fields.
        For a move, say which placement it started on and where it was going.
      render: yaml
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs and diagnostics
      description: |
        Include relevant redacted output, such as sproozi doctor for local setup,
        the harness's diagnose tool for refused gateway requests, or AgentRun
        status conditions and controller, gateway or agent logs for Kubernetes.
        Review output before sharing; it can contain private task content.
      render: text
