# Grants mcp.deepwiki: two of DeepWiki's read-only tools, each limited to one
# repository. List a server's real tool names and argument schemas with
#   python3 hack/mcp-tools.py https://mcp.deepwiki.com/mcp
# A tool name the server does not offer fails every call to the server.
apiVersion: sproozi.com/v1alpha1
kind: AgentPolicy
metadata:
  name: mcp-deepwiki
  namespace: sproozi-system
spec:
  allowedCapabilities: [model.inference, mcp.deepwiki]
  mcpServers:
    deepwiki:
      tools:
        read_wiki_structure:
          arguments:
            type: object
            required: [repoName]
            additionalProperties: false
            properties:
              repoName:
                const: modelcontextprotocol/go-sdk
        ask_wiki_question:
          arguments:
            type: object
            required: [repoName, question]
            additionalProperties: false
            properties:
              repoName:
                const: modelcontextprotocol/go-sdk
              question:
                type: string
                maxLength: 1000
  # These native scope fields remain required by the current API. They grant
  # no authority because their capabilities are absent above.
  kubernetesRead:
    namespaces: [sproozi-system]
    resources: [pods]
  githubPullRequest:
    repositories: []
    allowedBaseBranches: []
  egressProfiles: []
  budgets:
    model.inference:
      maxUnits: 100000
    mcp.deepwiki:
      maxUnits: 10
  resourceBounds:
    max:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 2Gi
  maxExecutionDuration: 10m
  retentionTTL: 24h
