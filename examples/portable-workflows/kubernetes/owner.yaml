# The remote executor (sproozi-work), the owner of its remote work: see "Owner"
# in GLOSSARY.md. Install alongside the managed native runtime and shared
# gateway. Set the native image to the reviewed digest; prepare profile config,
# TLS and the Hermes work token. The CLI reaches it through a kubeconfig context
# (docs/reference/remote-executors.md): the Service carries the
# sproozi.com/remote-executor label, the ConfigMap sproozi-remote-executor
# publishes its CA, and it reviews the short-lived sproozi-cli token the CLI
# mints for the audience sproozi-remote-executor, which the auth-delegator
# binding below allows.
# The administrator creates the executor's configuration ConfigMap
# sproozi-work-profile and the CLI's trust anchor sproozi-remote-executor in
# sproozi-sessions with "immutable: true" (cmd/session-profile/README.md). The
# executor's Role below may update ConfigMaps there, for registrations, so
# immutability is what stops it rewriting its own profile or the CA.
# The executor, its managed runs and their registrations live in their own
# namespace. The executor writes ConfigMaps here, so it must not share a
# namespace with the gateway's configuration in sproozi-system (ADR 0041), and
# the CLI's port-forward access here reaches only the executor.
apiVersion: v1
kind: Namespace
metadata:
  name: sproozi-sessions
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sproozi-work
  namespace: sproozi-sessions
---
# The gateway reads each managed run's registration in the run's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sproozi-shared-gateway-registry
  namespace: sproozi-sessions
rules:
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sproozi-shared-gateway-registry
  namespace: sproozi-sessions
subjects:
- kind: ServiceAccount
  name: sproozi-shared-gateway
  namespace: sproozi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sproozi-shared-gateway-registry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sproozi-work
  namespace: sproozi-sessions
rules:
- apiGroups: [sproozi.com]
  resources: [agenttemplates, agentpolicies, agentruntimes]
  verbs: [get]
- apiGroups: [sproozi.com]
  resources: [agentruns]
  verbs: [get, create, patch]
# Registrations and stored profiles. This reaches sproozi-work-profile and
# sproozi-remote-executor too; create both immutable.
- apiGroups: ['']
  resources: [configmaps]
  verbs: [get, create, update]
---
# The executor initializes and seals run accounts, BudgetLedger resources in the
# gateway's namespace (ADR 0045); it never lists or deletes them. The grant is
# for ledgers only, so it cannot write the gateway's configuration ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sproozi-work-budget
  namespace: sproozi-system
rules:
- apiGroups: [sproozi.com]
  resources: [budgetledgers]
  verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sproozi-work-budget
  namespace: sproozi-system
subjects:
- kind: ServiceAccount
  name: sproozi-work
  namespace: sproozi-sessions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sproozi-work-budget
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sproozi-work
  namespace: sproozi-sessions
subjects:
- kind: ServiceAccount
  name: sproozi-work
  namespace: sproozi-sessions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sproozi-work
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sproozi-work
  namespace: sproozi-agents
rules:
- apiGroups: ['']
  resources: [pods]
  verbs: [get, patch, delete]
- apiGroups: ['']
  resources: [pods/exec]
  verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sproozi-work
  namespace: sproozi-agents
subjects:
- kind: ServiceAccount
  name: sproozi-work
  namespace: sproozi-sessions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sproozi-work
---
# TokenReview and SubjectAccessReview, to authorize the CLI's ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sproozi-work-auth-delegator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
- kind: ServiceAccount
  name: sproozi-work
  namespace: sproozi-sessions
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sproozi-work-state
  namespace: sproozi-sessions
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: sproozi-work
  namespace: sproozi-sessions
  labels:
    sproozi.com/remote-executor: "true"
spec:
  selector:
    app: sproozi-work
  ports:
  - name: https
    port: 8443
    targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sproozi-work
  namespace: sproozi-sessions
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sproozi-work
  template:
    metadata:
      labels:
        app: sproozi-work
    spec:
      serviceAccountName: sproozi-work
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: owner
        image: docker.io/sproozi-session/native:REPLACE_WITH_REVIEWED_DIGEST
        command: [/usr/local/bin/session-profile]
        args: [--config, /etc/sproozi-work/profile.json]
        ports:
        - name: https
          containerPort: 8443
        readinessProbe:
          tcpSocket:
            port: https
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: config
          mountPath: /etc/sproozi-work
          readOnly: true
        - name: credentials
          mountPath: /var/run/sproozi-work
          readOnly: true
        - name: state
          mountPath: /state
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: sproozi-work-profile
      - name: credentials
        secret:
          secretName: sproozi-work-credentials
          defaultMode: 0440
      - name: state
        persistentVolumeClaim:
          claimName: sproozi-work-state
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sproozi-work-private
  namespace: sproozi-sessions
spec:
  podSelector:
    matchLabels:
      app: sproozi-work
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: sproozi-coordinators
    ports:
    - protocol: TCP
      port: 8443
