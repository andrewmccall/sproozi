# Stock Hermes persists sessions, memory and cron on this PVC.
# Prepare hermes-coordinator Secrets and public task-service CA before applying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-state
  namespace: sproozi-coordinators
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-config
  namespace: sproozi-coordinators
immutable: true
data:
  config.yaml: |
    model:
      default: gpt-5.3-codex
      provider: openai-api
    platform_toolsets:
      api_server: [sproozi-tasks]
      cron: [sproozi-tasks]
    agent:
      max_turns: 24
    mcp_servers:
      sproozi-tasks:
        url: https://sproozi-tasks.sproozi-system.svc:8443/mcp
        enabled: true
        strict_redirect_headers: true
        headers:
          Authorization: "Bearer ${SPROOZI_TASK_TOKEN}"
        connect_timeout: 15
        timeout: 40
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-coordinator
  namespace: sproozi-coordinators
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-coordinator
  template:
    metadata:
      labels:
        app: hermes-coordinator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: hermes
        image: docker.io/nousresearch/hermes-agent@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
        # Native s6 owns the gateway; a second foreground gateway conflicts on PVC restart.
        args: [sleep, infinity]
        env:
        - name: HERMES_HOME
          value: /opt/data
        - name: HERMES_GATEWAY_BOOTSTRAP_STATE
          value: running
        - name: HERMES_SKIP_PM_AUTO_INSTALL
          value: '1'
        - name: API_SERVER_HOST
          value: 0.0.0.0
        - name: API_SERVER_PORT
          value: '8642'
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-coordinator
              key: api-key
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: hermes-coordinator
              key: model-key
        - name: SPROOZI_TASK_TOKEN
          valueFrom:
            secretKeyRef:
              name: hermes-coordinator
              key: task-token
        - name: SSL_CERT_FILE
          value: /etc/task-trust/ca-bundle.pem
        - name: REQUESTS_CA_BUNDLE
          value: /etc/task-trust/ca-bundle.pem
        ports:
        - name: api
          containerPort: 8642
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
        volumeMounts:
        - name: state
          mountPath: /opt/data
        - name: config
          mountPath: /opt/data/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: trust
          mountPath: /etc/task-trust
          readOnly: true
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: hermes-state
      - name: config
        configMap:
          name: hermes-config
      - name: trust
        configMap:
          name: hermes-task-trust
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-coordinator
  namespace: sproozi-coordinators
spec:
  selector:
    app: hermes-coordinator
  ports:
  - name: api
    port: 8642
    targetPort: api
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hermes-private-api
  namespace: sproozi-coordinators
spec:
  podSelector:
    matchLabels:
      app: hermes-coordinator
  policyTypes: [Ingress]
  ingress: []
