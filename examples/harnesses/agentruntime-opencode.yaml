# Replace the example image with your administrator-approved digest-pinned image.
apiVersion: sproozi.com/v1alpha1
kind: AgentRuntime
metadata:
  name: opencode
  namespace: sproozi-system
spec:
  clientConfig:
    harness: opencode
    trustBundleConfigMap:
      key: ca-bundle.pem
      name: sproozi-sandbox-trust
  ephemeralWorkspace:
    sizeLimit: 2Gi
  gatewayEndpoint: https://sproozi-gateway.sproozi-system.svc:8443
  podTemplate:
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          token="$(cat /var/run/sproozi/tokens/gateway/token)"
          proxy="https://sproozi:${token}@${SPROOZI_GATEWAY#https://}"
          export HTTP_PROXY="$proxy" HTTPS_PROXY="$proxy" http_proxy="$proxy" https_proxy="$proxy"
          export HOME=/home/agent
          export XDG_CONFIG_HOME="$HOME/.config" XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CACHE_HOME="$HOME/.cache" XDG_STATE_HOME="$HOME/.local/state"
          cd /workspace
          export OPENCODE_DISABLE_AUTOUPDATE=true OPENCODE_DISABLE_MODELS_FETCH=true
          export OPENCODE_DISABLE_PROJECT_CONFIG=true OPENCODE_DISABLE_CLAUDE_CODE=true
          export OPENCODE_DISABLE_EXTERNAL_SKILLS=true OPENCODE_DISABLE_DEFAULT_PLUGINS=true
          export OPENCODE_DISABLE_SHARE=true OPENCODE_DISABLE_LSP_DOWNLOAD=true
          export OPENCODE_CONFIG=/etc/sproozi/contract/opencode-mcp.json
          export OPENCODE_CONFIG_CONTENT="$(cat <<CONFIG
          {
            "enabled_providers": ["sproozi"],
            "provider": {
              "sproozi": {
                "npm": "@ai-sdk/openai",
                "options": {"baseURL": "https://api.openai.com/v1", "apiKey": "sproozi-local-placeholder"},
                "models": {"${SPROOZI_MODEL}": {"name": "${SPROOZI_MODEL}", "limit": {"context": 200000, "output": 8192}}}
              }
            },
            "instructions": ["/etc/sproozi/contract/instructions.txt"],
            "share": "disabled",
            "autoupdate": false,
            "plugin": [],
            "lsp": false,
            "permission": "allow"
          }
          CONFIG
          )"
          exec python3 /etc/sproozi/contract/opencode-launch.py --model "$SPROOZI_MODEL"
        command:
        - /bin/sh
        - -ec
        image: example/opencode@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        name: agent
        resources:
          limits:
            cpu: '1'
            ephemeral-storage: 2Gi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: SPROOZI_MODEL
          value: gpt-5.3-codex
      securityContext:
        fsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
  workloadContainers:
  - agent
