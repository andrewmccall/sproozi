# Replace the example image with your administrator-approved digest-pinned image.
# claude-launch.py, from the run contract, runs one `claude --print` and
# publishes its answer as the run result (harnesses reference). It needs
# Python 3 in the image, as the release's sproozi-native image has.
apiVersion: sproozi.com/v1alpha1
kind: AgentRuntime
metadata:
  name: claude-code
  namespace: sproozi-system
spec:
  clientConfig:
    harness: claude-code
    trustBundleConfigMap:
      key: ca-bundle.pem
      name: sproozi-sandbox-trust
    # To use Claude Code's own sign-in, such as a Claude subscription, instead
    # of the gateway's Anthropic key: set MODEL_AUTH_MODE=workload on the
    # gateway with no Anthropic key or token, keep the login in a claim, and
    # sign in once with `claude-launch.py --login` (AgentRuntime reference).
    # signIn:
    #   claims: {}
  ephemeralWorkspace:
    sizeLimit: 2Gi
  gatewayEndpoint: https://sproozi-gateway.sproozi-system.svc:8443
  podTemplate:
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - |
          token="$(cat /var/run/sproozi/tokens/gateway/token)"
          proxy="https://sproozi:${token}@${SPROOZI_GATEWAY#https://}"
          export HTTP_PROXY="$proxy" HTTPS_PROXY="$proxy" http_proxy="$proxy" https_proxy="$proxy"
          export HOME=/home/agent
          exec python3 /etc/sproozi/contract/claude-launch.py --model "$SPROOZI_MODEL"
        command:
        - /bin/sh
        - -ec
        image: example/claude-code@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        name: agent
        resources:
          limits:
            cpu: '1'
            ephemeral-storage: 2Gi
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: SPROOZI_MODEL
          value: claude-sonnet-4-5-20250929
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      securityContext:
        # The release's native image runs as UID/GID 1000; runtimes that
        # share a login claim must agree, or fsGroup regroups the login.
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
  workloadContainers:
  - agent
