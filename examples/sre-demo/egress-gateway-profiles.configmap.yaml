# Optional example, not listed in kustomization.yaml. The install creates an
# empty sproozi-egress-gateway-profiles ConfigMap; applying this file replaces
# it with two named profiles. Restart the gateway afterwards
# (kubectl rollout restart deployment/sproozi-gateway -n sproozi-system), and
# list a profile in both the AgentPolicy and the AgentTemplate egressProfiles
# before a run can use it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sproozi-egress-gateway-profiles
  namespace: sproozi-system
data:
  profiles.json: |
    {
      "go-modules": [
        { "scheme": "https", "host": "proxy.golang.org", "port": 443 },
        { "scheme": "https", "host": "sum.golang.org", "port": 443 }
      ],
      "pypi": [
        { "scheme": "https", "host": "pypi.org", "port": 443 },
        { "scheme": "https", "host": "files.pythonhosted.org", "port": 443 }
      ]
    }
