apiVersion: sproozi.com/v1alpha1
kind: AgentPolicy
metadata:
  name: sre
  namespace: sproozi-system
spec:
  allowedCapabilities:
    - kubernetes.read
    - github.pull_request
    - model.inference
  egressProfiles: []
  kubernetesRead:
    namespaces:
      - sproozi-demo
    resources:
      - pods
      - pods/log
      - events
      - services
      - deployments
      - replicasets
      - statefulsets
  githubPullRequest:
    repositories:
      - example/sproozi-demo
    allowedBaseBranches:
      - main
  budgets:
    model.inference:
      maxUnits: 100000
      maxCostMicros: 500000
  resourceBounds:
    max:
      cpu: "2"
      memory: 2Gi
      ephemeral-storage: 4Gi
  maxExecutionDuration: 1h
  retentionTTL: 720h
