# A Kind cluster for trying Sproozi. Kind's default network applies a new
# Pod's NetworkPolicy only after the Pod starts, so this disables it for
# Calico, which enforces policy from Pod start. Sandboxes run on the worker:
# NetworkPolicy always allows a Pod to reach its own node, which here would be
# the API server.
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
nodes:
- role: control-plane
- role: worker
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
