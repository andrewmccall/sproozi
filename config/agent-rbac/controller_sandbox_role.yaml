# The controller writes sandbox objects only in sproozi-agents. Its
# cluster-wide role keeps only the reads its cache and run lookups need.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-sandbox-writer
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  - serviceaccounts
  verbs:
  - create
  - delete
# Each named login's claim is created on first use and outlives every run;
# an existing claim is used as it is.
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - update
  - delete
