---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  - secrets
  verbs:
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - update
  - watch
- apiGroups:
  - sproozi.com
  resources:
  - agentpolicies
  - agentruntimes
  - agenttemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sproozi.com
  resources:
  - agentruns
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sproozi.com
  resources:
  - agentruns/finalizers
  verbs:
  - update
- apiGroups:
  - sproozi.com
  resources:
  - agentruns/status
  verbs:
  - get
  - patch
  - update
