apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shared-gateway
rules:
- apiGroups: [authentication.k8s.io]
  resources: [tokenreviews]
  verbs: [create]
- apiGroups: [sproozi.com]
  resources: [agentruns, agentpolicies, agenttemplates]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [serviceaccounts, pods, pods/log, events, services]
  verbs: [get, list, watch]
- apiGroups: [apps]
  resources: [deployments, replicasets, statefulsets]
  verbs: [get, list, watch]
