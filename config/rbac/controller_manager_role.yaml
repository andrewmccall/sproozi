# Cluster-wide reads only. The controller watches sandbox Pods and caches
# ServiceAccounts and NetworkPolicies, and reads a managed run's registry
# ConfigMap in the run namespace. It writes sandbox objects only in
# sproozi-agents, through the Role in config/agent-rbac.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - serviceaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sproozi.com
  resources:
  - agentpolicies
  - agentruntimes
  - agenttemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sproozi.com
  resources:
  - agentruns
  verbs:
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - sproozi.com
  resources:
  - agentruns/finalizers
  verbs:
  - update
- apiGroups:
  - sproozi.com
  resources:
  - agentruns/status
  verbs:
  - get
  - patch
  - update
