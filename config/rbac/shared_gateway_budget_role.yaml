# The gateway reserves, settles, sweeps and prunes BudgetLedger resources in
# its own namespace (ADR 0045). Granting only that resource type keeps its
# write access away from the ConfigMaps here that hold its configuration
# (egress profiles, MCP registry, pricing, auth mode).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-gateway-budget
rules:
- apiGroups: [sproozi.com]
  resources: [budgetledgers]
  verbs: [get, list, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-gateway-budget
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-gateway-budget
subjects:
- kind: ServiceAccount
  name: shared-gateway
  namespace: system
