apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/managed-by: kustomize
  name: webhook-role
  namespace: sproozi-system
# No Secret access here: this namespace holds provider and GitHub credentials.
# HMAC Secrets are read only in sproozi-webhooks (config/webhook-secrets).
rules:
- apiGroups:
  - sproozi.com
  resources:
  - agentruns
  verbs:
  - create
- apiGroups:
  - sproozi.com
  resources:
  - agentpolicies
  - agenttemplates
  verbs:
  - get
  - list
  - watch
