apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shared-gateway-credentials
rules:
- apiGroups: [""]
  resources: [secrets]
  resourceNames: [model-gateway-chatgpt]
  verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shared-gateway-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: shared-gateway-credentials
subjects:
- kind: ServiceAccount
  name: shared-gateway
  namespace: system
