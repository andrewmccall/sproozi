apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: shared-gateway
  name: gateway
  namespace: system
spec:
  ports:
  - name: proxy
    port: 8443
    protocol: TCP
    targetPort: 8443
  selector:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: shared-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: shared-gateway
  name: gateway
  namespace: system
spec:
  replicas: 1
  # A rotating ChatGPT credential has one refresh owner. Do not scale this demo
  # deployment or share its credential with another cluster/process.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sproozi
      app.kubernetes.io/component: shared-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproozi
        app.kubernetes.io/component: shared-gateway
    spec:
      serviceAccountName: shared-gateway
      # SIGTERM drains model calls for up to 30 s so each settles its
      # reservation (cmd/gateway drainTimeout); leave room for that.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: shared-gateway
        image: controller:latest
        command: ["/gateway"]
        env:
        - name: SPROOZI_ENABLED_CAPABILITIES
          value: kubernetes.read,model.inference,github.pull_request,packages.install,network.egress
        - name: SPROOZI_GATEWAY_CERT_FILE
          value: /var/run/sproozi-gateway/tls.crt
        - name: SPROOZI_GATEWAY_KEY_FILE
          value: /var/run/sproozi-gateway/tls.key
        - name: SPROOZI_GATEWAY_HOST
          value: sproozi-gateway.sproozi-system.svc
        - name: AGENT_NAMESPACE
          value: sproozi-agents
        - name: BUDGET_NAMESPACE
          value: sproozi-system
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-gateway-credentials
              key: openai-api-key
              optional: true
        - name: MODEL_AUTH_MODE
          valueFrom:
            configMapKeyRef:
              name: model-gateway-auth
              key: mode
              optional: true
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: model-gateway-credentials
              key: anthropic-api-key
              optional: true
        - name: OPENAI_SIGN_IN_TOKEN
          valueFrom:
            secretKeyRef:
              name: model-gateway-credentials
              key: openai-sign-in-token
              optional: true
        - name: ANTHROPIC_SIGN_IN_TOKEN
          valueFrom:
            secretKeyRef:
              name: model-gateway-credentials
              key: anthropic-sign-in-token
              optional: true
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: capability-proxy-github-app
              optional: true
              key: app-id
        - name: GITHUB_APP_INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: capability-proxy-github-app
              optional: true
              key: installation-id
        - name: GITHUB_APP_PRIVATE_KEY_PATH
          value: /var/run/secrets/sproozi/github-app/private-key.pem
        - name: EGRESS_PROFILES_PATH
          value: /etc/sproozi/egress/profiles.json
        - name: MODEL_PRICING_PATH
          value: /etc/sproozi/model/pricing.json
        - name: MCP_SERVERS_PATH
          value: /etc/sproozi/mcp/servers.json
        # Connection limits, sized together with the memory limit below: one
        # connection per MiB of limits.memory. The 256 KiB budget per inspected
        # connection (about 150 to 160 KiB measured by TestInspectedSessionMemory)
        # takes a quarter of the limit; the rest is headroom for model bodies,
        # heap and GC. Lower them with it.
        # SPROOZI_GATEWAY_MAX_SESSIONS_PER_EXECUTION is deliberately unset:
        # it then defaults to min(16, SPROOZI_GATEWAY_MAX_CONNECTIONS), so
        # lowering the connection limit alone below 16 still starts. Set it
        # only to change the per-execution limit; it must not exceed the
        # connection limit.
        - name: SPROOZI_GATEWAY_MAX_CONNECTIONS
          value: "2048"
        # The gateway sets GOMEMLIMIT to 90% of the memory limit below, so
        # garbage collection tightens before the container is OOM-killed. An
        # explicit GOMEMLIMIT here takes precedence, but the limit is still
        # checked: below 64Mi the gateway refuses to start. It logs the Go
        # memory limit in effect and its source at startup.
        - name: SPROOZI_GATEWAY_MEMORY_LIMIT
          valueFrom:
            resourceFieldRef:
              containerName: shared-gateway
              resource: limits.memory
        volumeMounts:
        - name: gateway-tls
          mountPath: /var/run/sproozi-gateway
          readOnly: true
        - name: github-app
          mountPath: /var/run/secrets/sproozi/github-app
          readOnly: true
        - name: profiles
          mountPath: /etc/sproozi/egress
          readOnly: true
        - name: model-pricing
          mountPath: /etc/sproozi/model
          readOnly: true
        - name: mcp-servers
          mountPath: /etc/sproozi/mcp
          readOnly: true
        ports:
        - name: proxy
          containerPort: 8443
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        # The gateway opens the plain health port only after startup validation
        # passes and the TLS listener on 8443 is bound, so a gateway that exits
        # on bad configuration never becomes ready. The port answers only
        # GET /readyz; the Service does not expose it and the default-deny
        # NetworkPolicy keeps other Pods from reaching it.
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          periodSeconds: 5
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        # Requests stay small so an idle cluster reserves little. The limits are
        # ceilings for many concurrent runs: every inspected connection holds
        # TLS buffers, and handshakes cost CPU. Administrators may lower them,
        # together with SPROOZI_GATEWAY_MAX_CONNECTIONS above (one connection
        # per MiB). Raise the
        # requests instead if the gateway needs guaranteed capacity.
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: "2"
            memory: 2Gi
      volumes:
      - name: gateway-tls
        secret:
          secretName: sproozi-gateway-tls
      - name: github-app
        secret:
          optional: true
          secretName: capability-proxy-github-app
          items:
          - key: private-key.pem
            path: private-key.pem
      - name: profiles
        configMap:
          name: egress-gateway-profiles
          items:
          - key: profiles.json
            path: profiles.json
      - name: model-pricing
        configMap:
          name: model-gateway-pricing
          items:
          - key: pricing.json
            path: pricing.json
      - name: mcp-servers
        configMap:
          name: mcp-servers
          items:
          - key: servers.json
            path: servers.json
