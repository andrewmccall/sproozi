apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: capability-proxy
    app.kubernetes.io/managed-by: kustomize
  name: capability-proxy
  namespace: system
spec:
  ports:
  - name: http
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: capability-proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: capability-proxy
    app.kubernetes.io/managed-by: kustomize
  name: capability-proxy
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sproozi
      app.kubernetes.io/component: capability-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproozi
        app.kubernetes.io/component: capability-proxy
    spec:
      serviceAccountName: capability-proxy
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: capability-proxy
        image: controller:latest
        command:
        - /capability-proxy
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: capability-proxy-github-app
              key: app-id
        - name: GITHUB_APP_INSTALLATION_ID
          valueFrom:
            secretKeyRef:
              name: capability-proxy-github-app
              key: installation-id
        - name: GITHUB_APP_PRIVATE_KEY_PATH
          value: /var/run/secrets/sproozi/github-app/private-key.pem
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 128Mi
        volumeMounts:
        - mountPath: /var/run/secrets/sproozi/github-app
          name: github-app
          readOnly: true
      volumes:
      - name: github-app
        secret:
          secretName: capability-proxy-github-app
          items:
          - key: private-key.pem
            path: private-key.pem
