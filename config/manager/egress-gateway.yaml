apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: egress-gateway
    app.kubernetes.io/managed-by: kustomize
  name: egress-gateway
  namespace: system
spec:
  ports:
  - name: http
    port: 8082
    protocol: TCP
    targetPort: 8082
  selector:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: egress-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: egress-gateway
    app.kubernetes.io/managed-by: kustomize
  name: egress-gateway
  namespace: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sproozi
      app.kubernetes.io/component: egress-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproozi
        app.kubernetes.io/component: egress-gateway
    spec:
      serviceAccountName: egress-gateway
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: egress-gateway
        image: controller:latest
        command:
        - /egress-gateway
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        env:
        - name: EGRESS_PROFILES_PATH
          value: /etc/sproozi/egress/profiles.json
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 25m
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/sproozi/egress
          name: profiles
          readOnly: true
      volumes:
      - name: profiles
        configMap:
          name: egress-gateway-profiles
          items:
          - key: profiles.json
            path: profiles.json
