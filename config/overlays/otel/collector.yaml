apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: otel-collector
  name: sproozi-otel-collector
  namespace: sproozi-system
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20
      batch: {}
    exporters:
      # Replace debug with your backend, for example:
      # otlphttp:
      #   endpoint: https://otlp.example.com
      #   headers:
      #     authorization: Bearer ${env:BACKEND_TOKEN}
      debug:
        verbosity: basic
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: otel-collector
  name: sproozi-otel-collector
  namespace: sproozi-system
spec:
  selector:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: otel-collector
  ports:
  - name: otlp-http
    port: 4318
    targetPort: otlp-http
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: otel-collector
  name: sproozi-otel-collector
  namespace: sproozi-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sproozi
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproozi
        app.kubernetes.io/component: otel-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: collector
        # Core distribution 0.162.0, pinned by digest.
        image: otel/opentelemetry-collector:0.162.0@sha256:310a800ad69ee430e7c541796852a242c9c7db97aaad4daa5ccf843c525fbdb2
        args: ["--config=/etc/otelcol/config.yaml"]
        ports:
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /etc/otelcol
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: sproozi-otel-collector
