# Optional self-managed gateway certificate authority. It replaces the manual
# CA steps and needs no cert-manager. Omit it to supply certificates yourself.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- secrets.yaml
- rbac.yaml
- deployment.yaml
images:
- name: controller
  newName: example.com/sproozi
  newTag: v0.0.1
