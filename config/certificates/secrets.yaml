# Precreated so the controller needs only get/update on these two names. The
# manifests carry no data: reapplying them never resets the CA or leaf.
apiVersion: v1
kind: Secret
metadata:
  name: sproozi-certificate-authority
  namespace: sproozi-system
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: certificates
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: sproozi-gateway-tls
  namespace: sproozi-system
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: certificates
type: Opaque
