apiVersion: apps/v1
kind: Deployment
metadata:
  name: sproozi-certificates
  namespace: sproozi-system
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: certificates
spec:
  # One certificate owner. Secret updates also use optimistic concurrency.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sproozi
      app.kubernetes.io/component: certificates
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sproozi
        app.kubernetes.io/component: certificates
    spec:
      serviceAccountName: sproozi-certificates
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: certificates
        image: controller:latest
        command: ["/certificates"]
        # Add --dns for every inspected authority the gateway enables, such
        # as api.openai.com when model inference is enabled.
        args:
        - --dns=sproozi-gateway.sproozi-system.svc
        - --dns=sproozi-gateway.sproozi-system.svc.cluster.local
        - --dns=kubernetes.default.svc
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
        - name: scratch
          mountPath: /var/run/sproozi-certificates
      volumes:
      - name: scratch
        emptyDir:
          medium: Memory
          sizeLimit: 4Mi
