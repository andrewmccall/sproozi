---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentpolicies.sproozi.com
spec:
  group: sproozi.com
  names:
    kind: AgentPolicy
    listKind: AgentPolicyList
    plural: agentpolicies
    singular: agentpolicy
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentPolicy is the Schema for the agentpolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AgentPolicy
            properties:
              allowedCapabilities:
                description: AllowedCapabilities lists the capabilities that a run
                  may request.
                items:
                  description: CapabilityKind identifies an operation that may be
                    granted to an AgentRun.
                  maxLength: 67
                  pattern: ^(kubernetes[.]read|github[.]pull_request|model[.]inference|network[.]egress|packages[.]install|mcp[.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)$
                  type: string
                  x-kubernetes-validations:
                  - message: mcp.sproozi is reserved for the Sproozi control connection
                    rule: self != 'mcp.sproozi'
                maxItems: 32
                minItems: 1
                type: array
              budgets:
                additionalProperties:
                  description: |-
                    EndpointBudget bounds one capability's consumption for an AgentRun.
                    Models consume tokens; other endpoints consume upstream requests.
                  properties:
                    maxCostMicros:
                      description: |-
                        MaxCostMicros is the ceiling in millionths of a US dollar; zero is uncapped.
                        Only endpoints with trusted pricing can consume a monetary budget.
                      format: int64
                      minimum: 0
                      type: integer
                    maxUnits:
                      description: MaxUnits is the consumption ceiling; zero leaves
                        units uncapped.
                      format: int64
                      minimum: 0
                      type: integer
                  required:
                  - maxCostMicros
                  - maxUnits
                  type: object
                  x-kubernetes-validations:
                  - message: at least one budget limit must be positive
                    rule: self.maxUnits > 0 || self.maxCostMicros > 0
                description: |-
                  Budgets optionally bound consumption per capability and AgentRun.
                  Omitted capabilities have no consumption ceiling.
                maxProperties: 32
                type: object
                x-kubernetes-validations:
                - message: budget keys must be native or named MCP capabilities
                  rule: self.all(k, k.matches('^(kubernetes[.]read|github[.]pull_request|model[.]inference|network[.]egress|packages[.]install|mcp[.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)$'))
              egressProfiles:
                description: EgressProfiles lists the named egress profiles available
                  to templates.
                items:
                  type: string
                maxItems: 32
                type: array
              githubPullRequest:
                description: GitHubPullRequest constrains GitHub pull request operations.
                properties:
                  allowedBaseBranches:
                    description: AllowedBaseBranches lists the only target branches
                      for created pull requests.
                    items:
                      type: string
                    maxItems: 32
                    type: array
                  repositories:
                    description: Repositories lists repositories in owner/name form.
                    items:
                      type: string
                    maxItems: 64
                    type: array
                required:
                - allowedBaseBranches
                - repositories
                type: object
              kubernetesRead:
                description: KubernetesRead constrains Kubernetes read operations.
                properties:
                  namespaces:
                    description: Namespaces lists target namespaces the AgentRun may
                      read.
                    items:
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                  resources:
                    description: Resources lists Kubernetes resources and subresources
                      the AgentRun may read.
                    items:
                      description: KubernetesReadResource is one safe resource/subresource
                        that an AgentRun may inspect.
                      enum:
                      - pods
                      - pods/log
                      - events
                      - services
                      - deployments
                      - replicasets
                      - statefulsets
                      type: string
                    maxItems: 32
                    minItems: 1
                    type: array
                required:
                - namespaces
                - resources
                type: object
              maxExecutionDuration:
                default: 1h
                description: MaxExecutionDuration is the longest an AgentRun may execute.
                type: string
                x-kubernetes-validations:
                - message: must not exceed one hour
                  rule: duration(self) <= duration('1h')
              mcpServers:
                additionalProperties:
                  description: MCPServerScope grants only explicitly named tools of
                    a registered server.
                  properties:
                    tools:
                      additionalProperties:
                        description: MCPToolScope adds argument predicates to the
                          discovered input schema.
                        properties:
                          arguments:
                            description: |-
                              Arguments is an optional JSON Schema restriction. It cannot replace the
                              upstream input schema or establish the tool's service semantics.
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                        type: object
                      description: Tools is a default-deny map, not a copy of the
                        server's discovered catalogue.
                      maxProperties: 128
                      minProperties: 1
                      type: object
                      x-kubernetes-validations:
                      - message: invalid MCP tool name
                        rule: self.all(k, k.matches('^[A-Za-z0-9_.-]{1,128}$'))
                  required:
                  - tools
                  type: object
                description: |-
                  MCPServers constrains named MCP capabilities. Registration URLs and
                  provider credentials belong exclusively to trusted gateway configuration.
                maxProperties: 32
                type: object
                x-kubernetes-validations:
                - message: MCP server names must be DNS labels
                  rule: self.all(k, k.matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'))
              packagesInstall:
                description: PackagesInstall constrains package artifacts that may
                  be downloaded for a run.
                properties:
                  allowSourceBuilds:
                    description: AllowSourceBuilds must remain false for the wheel-only
                      implementation.
                    type: boolean
                  artifacts:
                    description: Artifacts is the complete set of wheels and locked
                      dependencies allowed.
                    items:
                      description: PackageArtifact is one exact package identity and
                        SHA-256 digest.
                      properties:
                        dependencies:
                          description: Dependencies contains the complete locked dependency
                            identities.
                          items:
                            description: PackageDependency identifies a dependency
                              that must also be present in Artifacts.
                            properties:
                              name:
                                type: string
                              version:
                                type: string
                            required:
                            - name
                            - version
                            type: object
                          maxItems: 64
                          type: array
                        filename:
                          description: Filename is the exact wheel filename advertised
                            by registry metadata.
                          maxLength: 255
                          minLength: 1
                          type: string
                        name:
                          description: Name is the normalized package name.
                          maxLength: 128
                          minLength: 1
                          pattern: ^[a-z0-9]+([._-][a-z0-9]+)*$
                          type: string
                        sha256:
                          description: SHA256 is the lowercase hexadecimal digest
                            of the wheel bytes.
                          pattern: ^[a-f0-9]{64}$
                          type: string
                        version:
                          description: Version is an exact PEP 440 version string.
                          maxLength: 64
                          minLength: 1
                          type: string
                      required:
                      - filename
                      - name
                      - sha256
                      - version
                      type: object
                    maxItems: 128
                    type: array
                  ecosystems:
                    description: Ecosystems lists the supported registries for this
                      scope.
                    items:
                      description: PackageEcosystem identifies a supported package
                        registry protocol.
                      enum:
                      - pypi
                      type: string
                    maxItems: 8
                    type: array
                  maxDownloadBytes:
                    description: MaxDownloadBytes caps each artifact response, including
                      metadata responses.
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - artifacts
                - ecosystems
                - maxDownloadBytes
                type: object
              resourceBounds:
                description: ResourceBounds caps the resources selected by an AgentRuntime.
                properties:
                  max:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: Max is the maximum permitted resource quantity for
                      each resource name.
                    type: object
                required:
                - max
                type: object
              retentionTTL:
                default: 720h
                description: RetentionTTL is how long terminal AgentRuns are retained.
                type: string
                x-kubernetes-validations:
                - message: must be greater than zero
                  rule: duration(self) > duration('0s')
            required:
            - allowedCapabilities
            - egressProfiles
            - githubPullRequest
            - kubernetesRead
            - resourceBounds
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
