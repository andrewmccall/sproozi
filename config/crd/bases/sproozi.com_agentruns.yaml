---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: agentruns.sproozi.com
spec:
  group: sproozi.com
  names:
    kind: AgentRun
    listKind: AgentRunList
    plural: agentruns
    singular: agentrun
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AgentRun is the Schema for the agentruns API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AgentRun
            properties:
              cancel:
                description: Cancel requests cancellation of an active run.
                type: boolean
              capabilities:
                description: Capabilities is the requested subset of capabilities
                  permitted by the policy.
                items:
                  description: CapabilityKind identifies an operation that may be
                    granted to an AgentRun.
                  maxLength: 67
                  pattern: ^(kubernetes[.]read|github[.]pull_request|model[.]inference|network[.]egress|packages[.]install|mcp[.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)$
                  type: string
                maxItems: 32
                minItems: 1
                type: array
              eventContext:
                additionalProperties:
                  type: string
                description: EventContext is immutable untrusted evidence supplied
                  by the caller or webhook.
                type: object
              task:
                description: Task is untrusted free-form work requested from the agent.
                type: string
              templateRef:
                description: TemplateRef identifies the administrator-managed template
                  for this run.
                properties:
                  name:
                    description: Name is the referenced AgentTemplate name.
                    type: string
