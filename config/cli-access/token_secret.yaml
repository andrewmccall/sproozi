# Kubernetes fills this Secret with a long-lived token for sproozi-cli, which
# the "sproozi" kubeconfig context uses. The home daemon keeps using the context
# after the CLI exits, so a token that expires within hours does not suit it.
# Delete and re-create the Secret to rotate the token.
apiVersion: v1
kind: Secret
metadata:
  name: sproozi-cli-token
  labels:
    app.kubernetes.io/name: sproozi
    app.kubernetes.io/component: cli-access
  annotations:
    kubernetes.io/service-account.name: sproozi-cli
type: kubernetes.io/service-account-token
