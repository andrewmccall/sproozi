version: 2
project_name: sproozi
builds:
  - main: ./cmd/sproozi
    binary: sproozi
    env: [CGO_ENABLED=0]
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .FullCommit }} -X main.date={{ .CommitDate }} -X github.com/andrewmccall/sproozi/internal/localsetup.releaseNative={{ index .Env "SPROOZI_NATIVE_IMAGE" }}
archives:
  - name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE]
checksum:
  name_template: checksums.txt
release:
  draft: true
  prerelease: auto
  include_meta: true
changelog:
  sort: asc
